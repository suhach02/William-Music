<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моє Портфоліо</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            border: 1px solid #30363d;
        }
        h1 { color: #58a6ff; margin-bottom: 10px; }
        p { color: #8b949e; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #238636;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привіт, я розробник! 👋</h1>
        <p>Це мій перший сайт, задеплоєний через Git та GitHub Pages.</p>
        <a href="https://github.com" class="btn">Мій GitHub</a>
    </div>
</body>
</html>
