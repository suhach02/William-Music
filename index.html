<!DOCTYPE html>
<html lang="dk">
<head>
     <meta charset="UTF-8">
     <title>annoncegenerator</title>
<style>
	body {
		font-family: Arial, sans-serif;
		background-color: #f4f6f9;
		max-width: 500px;
		margin: 20px auto;
		padding:20px;
	}

	.card {
		background: white;
		padding: 25px;
		border-radius: 12px;
		box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
	}

	label {
		font-weight: bold;
		display:block;
		margin-top: 15px;
	}

	input {
	width: 100%;
	padding: 10px;
	margin-top: 5px;
	border: 1px solid #ccc;
	border-radius: 6px;
	box-sizing: border box;

	}

	button {
		width: 100%;
		padding: 12px;
		margin-top: 15px;
		border: none;
		border-radius: 6px;
		font-weight: bold;
		cursor: pointer;
		transition: all 0.2s ease; 

	}

	button:active {
		transform: translateY(0);
		
	}

	@keyframes fadeIn {
	from{
		opacity: 0;
		transform: translateY(-10px);

		}
	to {
		opacity: 1;
		transform: translateY(0);
		}
	}

	.animate-show {
		animation: fadeIn 0.4s ease-out forwards;
	}


	.btn-generate:hover {
		background-color: #218838;
		transform:translateY(-2px);
		box-shadow: 0 4px rgba(40, 167, 69, 0.3);

	}

	.btn-copy:hover {
		background-color: #0069d9;
		transform: translateY(-2px);
		box-shadow: 0 4px 8px rgba (0, 123, 225, 0.3);

	}
	.btn-generate {
		background-color: #111111;
		color: white;

	}

	.btn-copy {
		background-color: #00969d;
		color: black;

	}

	#output {
		background: #e9ecef;
		padding: 15px;
		border-radius: 6px;
		white-space: pre-wrap;
		font-family: monospace;
		margin-top: 15px;

	}
	

</style>
</head>
<body>
     
	<h2>annoncegenerator📦</h2>
	
	<!-- navn title -->
	<label>productnavn🥒:</label>
	<input type="text" id="productTitle" placeholder="ecco soft7">
	<br><br>

	<!-- størrelse title -->
	<label>størrelse🦣:</label>
	<input type="text" id="productSize" placeholder="Eu 42">
	<br><br>
	
	<!-- knap -->
	<button class="btn-generate" onclick="makeListing()">generere</button>
	<button class="btn-copy" onclick="copyText(this)">Kopier tekst</button>
	<hr>

	<!-- resultat plads -->
	<h3>færdig text</h3>
	<p id="output">description...</p>
<script>
        function makeListing() {
        let title = document.getElementById('productTitle').value;
        let size = document.getElementById('productSize').value;
	let resultText = "productnavn🥒: " + title + "\n\n størrelse🦣:" + size;
	let outputElement = document.getElementById('output');
	
	outputElement.innerText = resultText;
	

	outputElement.classList.remove('animate-show');
	void outputElement.offsetWidth;
	outputElement.classList.add('animate-show');

        }

		function copyText(buttonElement) {
			let textToCopy = document.getElementById('output').innerText;
			navigator.clipboard.writeText(textToCopy);

			let originalText = buttonElement.innerText;
			buttonElement.innerText = "Kopieret nahui🚀";
			buttonElement.style.backgroundColor = "28a745";
		}

		setTimeout(function() {
			buttonElement.innnerText = originalText;
			buttonElement.style.backgroundColor = "";
		}, 2000);
	
</script>
</body>
</html>
